# 1401 Probe boot menu. ASCII only: GRUB's EFI text console shows anything else as '?'.
set timeout=5
set default=0
insmod all_video
insmod efi_gop
# keep the firmware's framebuffer so the kernel's simpledrm shows text before any GPU driver loads
set gfxpayload=keep

set common="rdinit=/init quiet loglevel=3 efi=debug console=tty0 consoleblank=0 snd_intel_dspcfg.dsp_driver=1"

menuentry "1401 Probe - scan this computer (recommended)" {
	linux /boot/vmlinuz $common p1401.mode=full
	initrd /boot/initramfs.zst
}
menuentry "1401 Probe - safe scan (use this if the first one froze)" {
	linux /boot/vmlinuz $common nomodeset p1401.mode=safe
	initrd /boot/initramfs.zst
}
menuentry "Debug shell (for the 1401 team)" {
	linux /boot/vmlinuz $common p1401.mode=shell
	initrd /boot/initramfs.zst
}
menuentry "Turn this computer off" {
	halt
}
