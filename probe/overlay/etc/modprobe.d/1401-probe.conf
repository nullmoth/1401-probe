# 1401 Probe: drivers that coldplug must not load (blacklist only stops alias loading; an explicit
# `modprobe nouveau` in the last stage still works).
# GPU drivers wait for the last stage: they can blank or hang a screen, and the safe report
# is written to the stick before any of them runs.
blacklist nouveau
blacklist amdgpu
blacklist radeon
blacklist i915
blacklist xe
blacklist nvidiafb
blacklist rivafb
blacklist bochs
# watchdogs: a scan must never arm a hardware reset timer
blacklist iTCO_wdt
blacklist sp5100_tco
blacklist wdat_wdt
# belt and braces: the network/Wi-Fi/Bluetooth driver trees are deleted from this image at build time;
# these lines only matter if one ever sneaks back in.
install cfg80211 /bin/false
install mac80211 /bin/false
install bluetooth /bin/false
install btusb /bin/false
